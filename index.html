<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>malabar clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header_container">

            <div class="header-contact-container">
                <div class="header-contact">
                    <p><a href="" id="h_call_desk"><img src="img-assets\desk_call_icon.svg" alt="call_desk_icon" id="h_call_desk_icon">+91 22 62300916 </a></p>
                    <p><a href="" id="h_call_desk"><img src="img-assets/desk_whatsup_icons.svg" alt="desk_whatsup_icon" id="h_call_desk_icon">+91 9167780916 </a></p>
                </div>
            </div>

            <div class="header-content-container">
                <div class="header-content-logo">
                    <div class="header-content-logo-img"> 
                        <a href="index.html" ><img src="img-assets/logo.svg" alt="main logo"  id="h_main_logo_img"></a>
                    </div>
                </div>

                <div class="header-content-quick_access_container">
                    <div class="header-content-quick_access-left">
                       <input type="text" placeholder="Search" id="search-bar">
                       <label for="search-bar"></label>
                       <button type="submit">
                        <span></span>
                       </button>
                       <hr>
                    </div>
                    <div class="header-content-quick_access-right">
                        <div class="header-content-quick_access-right-content">
                            <div class="header-content-quick_access-right-content-stores">
                                <div><img src="img-assets/icon-store.svg" alt=""></div>
                                <p>stores</p>
                            </div>
                            <div class="header-content-quick_access-right-content-country">
                                <div><img src="img-assets/change-country-flag.svg" alt=""></div>
                                <p>country</p>
                            </div>
                            <div class="header-content-quick_access-right-content-profile">
                                 <div><img src="img-assets/icon-user.svg" alt=""></div>
                                <p>profile</p>
                            </div>
                            <div class="header-content-quick_access-right-content-wishlist">
                                 <div><img src="img-assets/wishlist.svg" alt=""></div>
                                <p>Wishlist</p>
                            </div>
                            <div class="header-content-quick_access-right-content-cart">
                                 <div><img src="img-assets/icon-cart.svg" alt=""></div>
                                <p>cart</p>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </header>
    <script src="script.js"></script>
</body>
</html>
